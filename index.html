<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Pink</title>
<style>
:root{--p:#f4a3bf;--p2:#fdeef3;--p3:#fff8fa;--t:#2b2b2e;--g:#9a9aa2;--l:#f0f0f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#fff;color:var(--t);font:15px/1.5 -apple-system,"PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;position:relative;display:flex;flex-direction:column;background:#fff}
#main{flex:1;overflow-y:auto;padding:18px 18px 90px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--l);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--g);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer}
nav button.on{color:var(--p)}
.hero{background:#faf7f8;color:var(--t);border-radius:26px;padding:26px 24px;border:1px solid var(--l)}
.hero b{display:block;font-size:34px;font-weight:600;letter-spacing:.5px;margin-top:4px}
.hero small{color:var(--g)}
.row{display:flex;align-items:center;justify-content:space-between}
.sec{margin:26px 4px 12px}
.sec h3{font-size:16px;font-weight:600}
.ib{border:0;background:var(--l);color:var(--t);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:16px 18px;margin-bottom:12px;box-shadow:0 6px 18px -14px rgba(0,0,0,.25);cursor:pointer}
.card .amt{font-weight:600}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top h2{font-size:18px;flex:1}
.back{border:0;background:var(--l);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--t)}
.en{display:flex;align-items:baseline;padding:18px 2px;border-bottom:1px solid var(--l)}
.en .y{font-size:44px;font-weight:600;letter-spacing:-1px;line-height:1}
.en .mt{font-size:17px;margin-left:6px}
.en .nt{font-size:17px;margin-left:6px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g)}
.en .am{font-size:19px;font-weight:500;margin-left:10px}
.fab{position:absolute;right:20px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--p);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px -6px rgba(242,121,159,.8);cursor:pointer;z-index:5}
.fab svg{width:26px;height:26px}
.mask{position:absolute;inset:0;background:rgba(40,20,30,.42);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
.mask.on{display:flex;animation:f .2s}
.sheet{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 20px 60px -10px rgba(0,0,0,.35);animation:u .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes u{from{transform:scale(.95);opacity:0}}@keyframes f{from{opacity:0}}
.sheet input,.sheet select,.sheet textarea{width:100%;border:1px solid var(--l);background:var(--p3);border-radius:16px;padding:12px 14px;font:inherit;color:var(--t);margin-bottom:10px;outline:none}
.sheet input:focus,.sheet textarea:focus,.sheet select:focus{border-color:var(--p)}
.two{display:flex;gap:10px}
.btn{width:100%;border:0;background:var(--t);color:#fff;border-radius:16px;padding:13px;font:inherit;font-weight:600;cursor:pointer;margin-top:4px}
.toast{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#fff;color:var(--p);border:1px solid #f8cddb;box-shadow:0 12px 30px -10px rgba(242,121,159,.5);border-radius:22px;padding:12px 20px;opacity:0;transition:.3s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.cover{height:190px;margin:-18px -18px 0;background:linear-gradient(160deg,#f3eef0,#e6dde1);background-size:cover;background-position:center;position:relative}
.cover button{position:absolute;right:14px;bottom:14px;border:0;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--t)}
.av{width:92px;height:92px;border-radius:50%;border:4px solid #fff;margin:-46px auto 0;background:var(--p2) center/cover;position:relative;display:grid;place-items:center;color:var(--p);box-shadow:0 8px 20px -10px rgba(0,0,0,.3);cursor:pointer}
.av svg{width:34px;height:34px}
.nm{text-align:center;font-size:19px;font-weight:600;margin-top:10px}
.bio{text-align:center;color:var(--g);font-size:13px;margin-top:2px}
.list{margin-top:26px;border:1px solid var(--l);border-radius:22px;overflow:hidden}
.list button{width:100%;display:flex;align-items:center;gap:12px;padding:15px 18px;border:0;border-bottom:1px solid var(--l);background:#fff;font:inherit;color:var(--t);cursor:pointer;text-align:left}
.list button:last-child{border:0}
.list svg{color:var(--g)}
.sp{flex:1}.hd{display:block;width:44px;height:5px;border-radius:5px;background:#dcd8dc;margin:-12px auto 18px}
.sheet .big{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 20px}
.big b{font-size:36px;color:var(--p)}
.sheet .big input{width:62%;border:0;background:none;font-size:46px;font-weight:600;padding:0;margin:0;border-radius:0;text-align:center}
.ys{display:flex;align-items:center;justify-content:space-between;background:var(--p3);border-radius:20px;padding:6px;margin-bottom:12px}
.ys button{border:0;background:#fff;width:38px;height:38px;border-radius:15px;display:grid;place-items:center;cursor:pointer;color:var(--t);box-shadow:0 3px 10px -5px rgba(0,0,0,.25)}
.ys b{font-size:22px;letter-spacing:1px}
.mg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.mg button{border:0;background:#f5f3f4;border-radius:14px;padding:11px 0;font:inherit;font-size:14px;color:var(--t);cursor:pointer}
.mg button.on{background:var(--t);color:#fff}
.yr{margin-bottom:22px}
.year-head{display:flex;align-items:center;justify-content:space-between;padding:6px 0;cursor:pointer;user-select:none}
.year-left{display:flex;align-items:baseline;gap:8px}
.fold{color:#b9b9bf;font-size:14px;transition:transform .15s;display:inline-block;line-height:1;width:12px}
.year-head.open .fold{transform:rotate(90deg)}
.year{font-size:16px;font-weight:800;letter-spacing:.5px;color:var(--t)}
.total{background:#FFF0F8;padding:1px 7px;border-radius:3px;font-weight:700;font-size:11px;color:var(--t)}
.items{display:none}
.year-head.open+.items{display:block}
.item{display:flex;align-items:baseline;justify-content:space-between;padding:8px 0 8px 24px;border-bottom:1px solid #f0f0f0}
.item.last{border-bottom:none}
.item-left{display:flex;align-items:baseline;gap:8px}
.mon{font-size:13px;font-weight:800;color:#000}
.note{font-size:11px;color:#999}
.amt{font-size:12px;font-weight:700;color:#000}

/* ===== 心愿单迁入：样式隔离 + 浮层适配（其余页面不受影响） ===== */
.w2{font-size:12px}
.sheet.w2sheet{font-size:12px;padding:26px 22px}
.sheet.w2sheet input,.sheet.w2sheet textarea{border:0;background:none;border-radius:0;padding:0;margin:0;font-size:12px;color:#2b2b2e;width:100%;outline:none}
.sheet.w2sheet input:focus,.sheet.w2sheet textarea:focus{border:0}
.sheet.w2sheet .btn,.drawer .btn{width:100%;border:0;background:#2b2b2e;color:#fff;border-radius:16px;padding:14px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.sheet.w2sheet .btn:disabled,.drawer .btn:disabled{background:#f0e6eb;color:#d9c7d2;cursor:not-allowed}
.drawer .btn.pink{background:#f4a3bf}
.drawer .btn.pink:disabled{background:#f0e6eb;color:#d9c7d2}
.wo-row .icon svg,.d-head .icon svg{width:24px;height:24px}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tab{border:0;border-radius:999px;padding:7px 20px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;background:#eeeef0;color:#aaa}
.tab.on{background:#f4a3bf;color:#fff}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 30px 40px;text-align:center}
.empty-ic{width:76px;height:76px;border-radius:50%;background:#f2f2f4;display:grid;place-items:center;color:#cfcfd4;margin-bottom:20px}
.empty-ic svg{width:34px;height:34px}
.empty-t{font-size:12px;color:#333;margin-bottom:26px}
.empty-btn{border:0;background:#f4a3bf;color:#fff;border-radius:999px;padding:12px 30px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.swipe{position:relative;border-radius:20px;overflow:hidden;margin-bottom:12px;background:#ff6b81}
.swipe .del{position:absolute;top:0;right:0;bottom:0;width:80px;border:0;background:#ff6b81;color:#fff;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.wo-row{position:relative;display:flex;align-items:center;background:#fff;border:1px solid #f0f0f2;border-radius:20px;padding:16px;cursor:pointer;transition:transform .2s;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.wo-row.drag{transition:none}
.wo-row .icon{width:48px;height:48px;border-radius:16px;background:#fdeef3;display:grid;place-items:center;color:#f4a3bf;margin-right:14px;flex-shrink:0}
.wo-row .info{flex:1;min-width:0}
.wo-row .info b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-row .info span{font-size:12px;color:#9a9aa2}
.wo-row .amt{font-weight:600;font-size:12px}
.add-bottom{display:block;width:100%;border:1px dashed #f4a3bf;background:#fff;color:#f4a3bf;border-radius:20px;padding:14px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;margin-top:14px}
.wo-title{font-size:12px;font-weight:600;margin-bottom:20px}
.row-line{display:flex;align-items:center;background:#fff8fa;border:1px solid #f0f0f2;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.row-line .ic{width:42px;height:42px;border-radius:50%;background:#fdeef3;display:grid;place-items:center;color:#f4a3bf;margin-right:12px;flex-shrink:0}
.row-line .ic svg{width:20px;height:20px}
.row-line .main{flex:1;min-width:0}
.row-line .main small{display:block;font-size:12px;color:#9a9aa2;margin-bottom:2px}
.row-line input{border:0;background:none;padding:0;margin:0;font:inherit;font-size:12px;width:100%;outline:none;color:#2b2b2e}
.row-line input::placeholder{color:#c8c8cc}
.budget{border:1px solid #f0f0f2;border-radius:16px;padding:14px;margin-bottom:18px;background:#fff8fa}
.budget small{display:block;font-size:12px;color:#9a9aa2;margin-bottom:4px}
.budget .price{display:flex;align-items:baseline}
.budget .price span{font-size:12px;color:#9a9aa2;margin-right:6px}
.budget .price input{border:0;background:none;font:inherit;font-size:12px;font-weight:700;color:#000;width:100%;outline:none}
.cat-label{font-size:12px;color:#9a9aa2;margin-bottom:10px;display:block}
.cats{display:flex;gap:10px;margin-bottom:18px}
.cats button{flex:1;border:1px solid #f0f0f2;background:#fff;border-radius:14px;padding:12px;font:inherit;font-size:12px;color:#9a9aa2;cursor:pointer}
.cats button.on{background:#fdeef3;color:#f4a3bf;border-color:#f4a3bf}
.msg-row{border:1px solid #f0f0f2;border-radius:16px;padding:12px 14px;margin-bottom:20px;background:#fff8fa}
.msg-row small{display:block;font-size:12px;color:#9a9aa2;margin-bottom:4px}
.msg-row textarea{border:0;background:none;font:inherit;font-size:12px;width:100%;outline:none;resize:none;height:44px;color:#2b2b2e}
.dmask{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(40,20,30,.42);display:none;align-items:flex-end;justify-content:center;z-index:25}
.dmask.on{display:flex;animation:f .2s}
.drawer{width:100%;max-width:480px;max-height:100%;min-height:0;overflow-y:auto;font-size:12px;background:#fff;border-radius:28px 28px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 60px -10px rgba(0,0,0,.35);animation:drop .3s cubic-bezier(.2,.9,.3,1.05)}
@keyframes drop{from{transform:translateY(100%)}}
.d-head{display:flex;align-items:center;margin-bottom:18px}
.d-head .icon{width:48px;height:48px;border-radius:16px;background:#fdeef3;display:grid;place-items:center;color:#f4a3bf;margin-right:14px;flex-shrink:0}
.d-head .t{flex:1;min-width:0}
.d-head .t b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-head .t span{font-size:12px;color:#9a9aa2}
.d-x{border:0;background:#f2f2f4;color:#9a9aa2;width:32px;height:32px;border-radius:50%;font-size:12px;cursor:pointer;flex-shrink:0}
.d-amt{font-size:12px;font-weight:700;color:#f4a3bf;margin:0 12px 0 8px;white-space:nowrap}
.d-left{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 8px}
.d-left small{font-size:12px;color:#9a9aa2}
.d-left strong{font-size:12px;font-weight:700;color:#f4a3bf}
.bar{height:10px;border-radius:99px;background:#fdeef3;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:#f4a3bf;border-radius:99px;transition:width .5s}
.d-stat{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 16px}
.d-stat div{flex:1;border:1px solid #f0f0f2;background:#fff8fa;border-radius:16px;padding:12px 14px}
.d-stat small{font-size:12px;color:#9a9aa2}
.d-stat b{font-size:12px}
.d-note{font-size:12px;color:#6b6b73;background:#fff8fa;border:1px solid #f0f0f2;border-radius:16px;padding:12px 14px;margin-bottom:14px;word-break:break-all}
.logs{margin-bottom:16px}
.logs .lh{font-size:12px;color:#9a9aa2;margin-bottom:8px}
.logs .li{display:flex;justify-content:space-between;font-size:12px;padding:9px 2px;border-bottom:1px solid #f4f4f6}
.logs .li b{color:#f4a3bf}
.logs .box{max-height:110px;overflow-y:auto}
.dep{display:flex;align-items:center;border:1px solid #f0f0f2;border-radius:16px;padding:10px 14px;margin-bottom:12px;background:#fff8fa}
.dep span{font-size:12px;color:#9a9aa2;margin-right:6px}
.dep input{border:0;background:none;font:inherit;font-size:12px;font-weight:700;color:#f4a3bf;width:100%;outline:none}
.dep input::placeholder{color:#e3c9d3;font-weight:600}
.banner{position:absolute;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-16px);max-width:calc(100% - 28px);background:#fff;color:#2b2b2e;border:1px solid #e9e9ec;border-radius:22px;padding:12px 20px;font-size:12px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.18);z-index:60;opacity:0;transition:.35s;pointer-events:none;white-space:nowrap}
.banner.on{opacity:1;transform:translateX(-50%)}
</style></head><body>
<div id="app">
<div id="main"></div>
<button class="fab" id="fab" style="display:none"></button>
<nav id="nav"></nav>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="dmask" id="dmask"><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast"></div>
<div class="banner" id="banner">哇塞你好厉害，已将此物收入囊中!</div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="imp" accept="application/json" hidden>
</div>
<script>
const I={
acc:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1"/>',
wish:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
set:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>',
cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
out:'<path d="M12 4v11M7 9l5-5 5 5M5 20h14"/>',inn:'<path d="M12 15V4M7 10l5 5 5-5M5 20h14"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
gift:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M12 8H8.5a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8zM12 8h3.5a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8z"/><path d="M3 14h18"/>',
check:'<path d="M4 12l5 5L20 6"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const $=s=>document.querySelector(s);
let D={profile:{name:'',bio:'',avatar:'',cover:''},accounts:[],wishes:[]};
try{const s=localStorage.getItem('pink-ledger');if(s)D=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem('pink-ledger',JSON.stringify(D))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const cents=n=>Math.round((Number(n)||0)*100);
const r2=n=>cents(n)/100;
const sumItems=arr=>(arr||[]).reduce((t,i)=>t+cents(i&&i.amt),0)/100;
const fmt=n=>'¥'+(Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>sumItems(a.items);
function normAcc(){
 if(!D.profile||typeof D.profile!=='object')D.profile={name:'',bio:'',avatar:'',cover:''};
 if(!Array.isArray(D.accounts))D.accounts=[];
 D.accounts.forEach(a=>{
  if(!a.id)a.id=uid();
  if(!Array.isArray(a.items))a.items=[];
  a.items.forEach(i=>{i.amt=r2(i.amt);i.y=parseInt(i.y)||new Date().getFullYear();i.m=Math.min(12,Math.max(1,parseInt(i.m)||1));if(!i.id)i.id=uid()});
 });
}
normAcc();
let tab='acc',cur=null;
$('#nav').innerHTML=[['acc','账户'],['wish','心愿单'],['set','设置']].map(([k,t])=>`<button data-k="${k}">${ic(k)}<span>${t}</span></button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.k;cur=null;w2closeDrawer();render()}};
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===tab));
 const fab=$('#fab');fab.style.display='none';
 const m=$('#main');m.style.background='';$('#nav').style.display=(tab==='acc'&&cur)?'none':'flex';
 if(tab==='acc'){
  if(cur){const a=D.accounts.find(x=>x.id===cur);if(!a){cur=null;return render()}
   const rows=a.items.slice().sort((x,y)=>y.y-x.y||y.m-x.m);
   const byYear={};rows.forEach(i=>{(byYear[i.y]=byYear[i.y]||[]).push(i)});
   const years=Object.keys(byYear).sort((a,b)=>b-a);
   m.innerHTML=`<div class="top"><button class="back" id="bk">${ic('back')}</button><h2>${esc(a.name)}</h2><b>${fmt(sum(a))}</b></div>`+
   years.map(y=>{const g=byYear[y],s=sumItems(g);
    return `<div class="yr"><div class="year-head open"><div class="year-left"><span class="fold">▸</span><span class="year">${y}</span></div><span class="total">${fmt(s)}</span></div><div class="items">`+
    g.map((i,idx)=>`<div class="item${idx===g.length-1?' last':''}"><div class="item-left"><span class="mon">/${String(i.m).padStart(2,'0')}</span><span class="note">${i.note?esc(i.note):''}</span></div><span class="amt">${fmt(i.amt)}</span></div>`).join('')+`</div></div>`}).join('');
   $('#bk').onclick=()=>{cur=null;render()};
   m.querySelectorAll('.year-head').forEach(h=>h.onclick=()=>h.classList.toggle('open'));
   fab.innerHTML=ic('plus');fab.style.display='grid';fab.onclick=()=>incomeSheet(a);
  }else{
   const tot=r2(D.accounts.reduce((t,a)=>t+cents(sum(a)),0)/100);
   m.innerHTML=`<div class="hero"><small>总收入</small><b>${fmt(tot)}</b></div>
   <div class="row sec"><h3>账户管理</h3><button class="ib" id="ad">${ic('plus')}</button></div>`+
   D.accounts.map(a=>`<div class="card row" data-id="${a.id}"><span>${esc(a.name)}</span><span class="amt">${fmt(sum(a))}</span></div>`).join('');
   $('#ad').onclick=accSheet;
   m.querySelectorAll('.card').forEach(c=>c.onclick=()=>{cur=c.dataset.id;render()});
  }
 }
 if(tab==='wish'){w2render()}
 if(tab==='set'){
  const p=D.profile;
  m.innerHTML=`<div class="cover" style="${p.cover?`background-image:url(${p.cover})`:''}"><button id="cv">${ic('cam')}</button></div>
  <div class="av" id="avt" style="${p.avatar?`background-image:url(${p.avatar})`:''}">${p.avatar?'':ic('set')}</div>
  <div class="nm">${esc(p.name||'Pink')}</div><div class="bio">${esc(p.bio||'')}</div>
  <div class="list"><button id="pf">${ic('edit')}<span class="sp">${'昵称 / 签名'}</span></button><button id="ex">${ic('out')}<span class="sp">导出账目</span></button><button id="im">${ic('inn')}<span class="sp">导入账目</span></button></div>`;
  $('#cv').onclick=()=>pick('cover');$('#avt').onclick=()=>pick('avatar');
  $('#pf').onclick=profSheet;$('#ex').onclick=exportD;$('#im').onclick=()=>$('#imp').click();
 }
}
function open(h,c){$('#sheet').className='sheet '+(c||'');$('#sheet').innerHTML=h;$('#mask').classList.add('on')}
function close(){$('#mask').classList.remove('on')}
$('#mask').onclick=e=>{if(e.target.id==='mask')close()};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function accSheet(){open(`<input id="an" placeholder="账户名称"><button class="btn" id="ok">确定</button>`);
 $('#ok').onclick=()=>{const n=$('#an').value.trim();if(!n)return;D.accounts.push({id:uid(),name:n,items:[]});save();close();render()}}
function incomeSheet(a){const d=new Date();let y=d.getFullYear(),mo=d.getMonth()+1;
 open(`<i class="hd"></i><div class="big"><b>¥</b><input id="ia" type="number" inputmode="decimal" placeholder="0.00"></div><div class="ys"><button id="yp">${ic('back')}</button><b id="yv">${y}</b><button id="yn" style="transform:scaleX(-1)">${ic('back')}</button></div><div class="mg">${Array.from({length:12},(_,i)=>`<button data-m="${i+1}" class="${i+1===mo?'on':''}">${i+1}月</button>`).join('')}</div><input id="in" placeholder="备注"><button class="btn" id="ok">确定</button>`);
 const yv=$('#yv');$('#yp').onclick=()=>yv.textContent=--y;$('#yn').onclick=()=>yv.textContent=++y;
 document.querySelectorAll('.mg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mo=+b.dataset.m});
 $('#ok').onclick=()=>{const v=parseFloat($('#ia').value);if(!(v>0))return;a.items.unshift({id:uid(),amt:r2(v),y,m:mo,note:$('#in').value.trim()});save();close();render()}}
function profSheet(){open(`<input id="pn" placeholder="昵称" value="${esc(D.profile.name)}"><input id="pb" placeholder="签名" value="${esc(D.profile.bio)}"><button class="btn" id="ok">确定</button>`);
 $('#ok').onclick=()=>{D.profile.name=$('#pn').value.trim();D.profile.bio=$('#pb').value.trim();save();close();render()}}
let target='';
function pick(t){target=t;$('#file').value='';$('#file').click()}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const mx=target==='cover'?900:300,s=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  D.profile[target]=c.toDataURL('image/jpeg',.75);save();render()};im.src=r.result};r.readAsDataURL(f)};
function exportD(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='pink-ledger.json';a.click()}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const j=JSON.parse(r.result);if(j.accounts&&j.wishes&&j.profile){D=j;normAcc();save();render();toast('导入成功')}else toast('文件格式不正确')}catch(x){toast('导入失败')}$('#imp').value=''};r.readAsText(f)};

/* ===================== 心愿单：由「心愿单.html」完整迁入 ===================== */
const w2Gift='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8v12M12 8l-4-4M12 8l4-4"/></svg>';
const w2Check='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
const w2$=id=>document.getElementById(id);
const w2today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const w2banner=()=>{const e=w2$('banner');e.classList.add('on');clearTimeout(w2banner._t);w2banner._t=setTimeout(()=>e.classList.remove('on'),3200)};
let w2tab='ing';

/* 数据统一落在 D.wishes（随 Pink 一起导入 / 导出）；
   若 Pink 尚无心愿数据，则吸收原独立页面 localStorage('wishes') 里的记录 */
if(!Array.isArray(D.wishes))D.wishes=[];
if(D.wishes.length===0){
 try{const s=localStorage.getItem('wishes');if(s){const a=JSON.parse(s);if(Array.isArray(a)&&a.length)D.wishes=a}}catch(e){}
}
function w2normalize(){
 D.wishes.forEach(x=>{
  x.amt=r2(typeof x.amt==='number'?x.amt:(Number(x.amt)||Number(x.budget)||0));
  x.saved=r2(x.saved);
  if(!Array.isArray(x.logs))x.logs=Array.isArray(x.log)?x.log.map(l=>({d:l.d,v:Number(l.a)||0})):[];
  x.logs.forEach(l=>{l.v=r2(l.v)});
  if(typeof x.note!=='string')x.note=typeof x.msg==='string'?x.msg:'';
  if(x.status!=='done')x.status=x.saved>=x.amt?'done':'ing';
  if(!x.id)x.id=uid();
  if(!x.cat)x.cat='虚拟物品';
 });
}

/* 键盘适配：抽屉锚定到 visualViewport 可视区域，键盘弹起时自动上移 */
const w2vv=window.visualViewport;
let w2drawerScrollTimer=null;
function w2fitDrawer(){
 const d=w2$('dmask');
 if(!d||!d.classList.contains('on'))return;
 if(w2vv){
  d.style.top=w2vv.offsetTop+'px';
  d.style.height=w2vv.height+'px';
  d.style.bottom='auto';
 }
 clearTimeout(w2drawerScrollTimer);
 w2drawerScrollTimer=setTimeout(()=>{const ok=w2$('dok');if(ok)ok.scrollIntoView({block:'end',behavior:'smooth'})},300);
 setTimeout(()=>{const ok=w2$('dok');if(ok)ok.scrollIntoView({block:'end'})},650);
}
if(w2vv){w2vv.addEventListener('resize',w2fitDrawer);w2vv.addEventListener('scroll',w2fitDrawer)}
window.addEventListener('resize',w2fitDrawer);

/* ---------- 列表渲染 ---------- */
function w2render(){
 w2normalize();
 const ing=D.wishes.filter(x=>x.status!=='done');
 const done=D.wishes.filter(x=>x.status==='done');
 const m=$('#main');
 m.innerHTML=`<div class="w2"><div class="tabs"><button class="tab ${w2tab==='ing'?'on':''}" data-w2="ing">心愿中 (${ing.length})</button><button class="tab ${w2tab==='done'?'on':''}" data-w2="done">已实现 (${done.length})</button></div><div id="w2list"></div></div>`;
 const box=w2$('w2list');
 const arr=w2tab==='ing'?ing:done;
 if(arr.length===0){
  box.innerHTML=w2tab==='ing'
  ?`<div class="empty"><div class="empty-ic">${w2Gift}</div><div class="empty-t">暂无心愿物品</div><button class="empty-btn" id="eb">+ 记下第一个心愿</button></div>`
  :`<div class="empty"><div class="empty-ic">${w2Check}</div><div class="empty-t">暂无已实现的心愿</div></div>`;
 }else{
  box.innerHTML=arr.map(x=>`<div class="swipe" data-id="${x.id}">
<button class="del" data-del="${x.id}">删除</button>
<div class="wo-row" data-id="${x.id}">
<div class="icon">${w2Gift}</div>
<div class="info"><b>${esc(x.name)}</b><span>${esc(x.cat)}</span></div>
<div class="amt">${fmt(x.amt)}</div>
</div></div>`).join('')
  +(w2tab==='ing'?`<button class="add-bottom" id="ab">+ 记下新心愿</button>`:'');
 }
 m.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{w2tab=b.dataset.w2;w2OpenRow=null;w2render()});
 if(w2tab==='ing'){
  const eb=w2$('eb');if(eb)eb.onclick=w2openForm;
  const ab=w2$('ab');if(ab)ab.onclick=w2openForm;
 }
 m.querySelectorAll('.wo-row').forEach(w2bindSwipe);
 m.querySelectorAll('.del').forEach(b=>b.onclick=e=>{
  e.stopPropagation();
  D.wishes=D.wishes.filter(o=>o.id!==b.dataset.del);
  save();w2render();toast('已删除');
 });
}

/* ---------- 左滑删除 / 点击进入详情 ---------- */
const w2W=80;
let w2OpenRow=null;
function w2closeOpenRow(except){
 if(w2OpenRow&&w2OpenRow!==except){w2OpenRow.style.transform='';w2OpenRow._x=0}
 if(!except)w2OpenRow=null;
}
function w2bindSwipe(row){
 let sx=0,sy=0,base=0,moved=false,tracking=false,dir=null;
 row._x=0;
 row.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  tracking=true;moved=false;row._moved=false;dir=null;sx=e.clientX;sy=e.clientY;base=row._x||0;
  w2closeOpenRow(row);
 });
 row.addEventListener('pointermove',e=>{
  if(!tracking)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(!dir){
   if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
   dir=Math.abs(dx)>Math.abs(dy)?'h':'v';
   if(dir==='h'){moved=true;row.classList.add('drag');try{row.setPointerCapture(e.pointerId)}catch(_){}}
  }
  if(dir!=='h')return;
  row._x=Math.max(-w2W,Math.min(0,base+dx));
  row.style.transform='translateX('+row._x+'px)';
 });
 const end=e=>{
  if(!tracking)return;
  tracking=false;row.classList.remove('drag');row._moved=moved;
  if(!moved)return;
  const open=row._x<-w2W/2;
  row._x=open?-w2W:0;
  row.style.transform=open?'translateX(-'+w2W+'px)':'';
  w2OpenRow=open?row:null;
 };
 row.addEventListener('click',()=>{
  if(row._moved){row._moved=false;return}
  if(row._x<0){row._x=0;row.style.transform='';w2OpenRow=null;return}
  w2openDrawer(row.dataset.id);
 });
 row.addEventListener('pointerup',end);
 row.addEventListener('pointercancel',end);
}
document.addEventListener('pointerdown',e=>{
 if(w2OpenRow&&!e.target.closest('.swipe'))w2closeOpenRow();
});

/* ---------- 详情抽屉 ---------- */
let w2curId=null;
function w2openDrawer(id){
 const x=D.wishes.find(o=>o.id===id);if(!x)return;
 w2curId=id;
 const left=Math.max(0,(cents(x.amt)-cents(x.saved))/100);
 const isDone=x.status==='done';
 w2$('drawer').innerHTML=
`<div class="d-head"><div class="icon">${w2Gift}</div><div class="t"><b>${esc(x.name)}</b><span>${esc(x.cat)}</span></div><div class="d-amt">${fmt(x.amt)}</div><button class="d-x" id="dx">✕</button></div>
<div class="d-left"><small>${isDone?'已达成目标':'还差'}</small><strong>${isDone?fmt(x.amt):fmt(left)}</strong></div>
<div class="d-stat"><small>已存入</small><b>${fmt(x.saved)}</b></div>
${x.note?`<div class="d-note">${esc(x.note)}</div>`:''}
${x.logs.length?`<div class="logs"><div class="lh">存入记录</div><div class="box">${x.logs.slice().reverse().map(l=>`<div class="li"><span>${l.d}</span><b>+${fmt(l.v)}</b></div>`).join('')}</div></div>`:''}
${isDone?'':`<div class="dep"><span>¥</span><input id="dv" type="number" inputmode="decimal" placeholder="今天存入多少？" min="0"></div>
<button class="btn pink" id="dok" disabled>存入</button>`}`;
 w2$('dmask').classList.add('on');
 w2$('dx').onclick=w2closeDrawer;
 if(w2vv)w2fitDrawer();
 if(!isDone){
  const dv=w2$('dv'),dok=w2$('dok');
  dv.oninput=()=>{dok.disabled=!(parseFloat(dv.value)>0)};
  dv.onkeydown=e=>{if(e.key==='Enter'&&!dok.disabled)dok.click()};
  dok.onclick=()=>w2deposit(dv);
  /* 聚焦时重新定位抽屉并延迟滚动，确保按钮不被键盘遮挡、可点击 */
  dv.addEventListener('focus',()=>{
   w2fitDrawer();
   setTimeout(w2fitDrawer,300);
   setTimeout(w2fitDrawer,650);
  });
 }
}
function w2closeDrawer(){
 const d=w2$('dmask');
 if(!d)return;
 d.classList.remove('on');
 d.style.top='';d.style.height='';d.style.bottom='';
 w2curId=null;
}
function w2deposit(input){
 const x=D.wishes.find(o=>o.id===w2curId);if(!x)return;
 const v=Math.round(parseFloat(input.value)*100)/100;
 if(!(v>0))return;
 x.saved=(cents(x.saved)+cents(v))/100;
 x.logs.push({d:w2today(),v});
 if(x.saved>=x.amt){
  x.status='done';
  save();w2closeDrawer();w2render();
  toast('哇塞你好厉害，已将此物收入囊中!');
  w2banner();
 }else{
  save();w2render();w2openDrawer(x.id);
  toast('恭喜你，离目标又近一步 (☆^ー^☆) ');
 }
}
w2$('dmask').onclick=e=>{if(e.target.id==='dmask')w2closeDrawer()};

/* ---------- 新增心愿表单 ---------- */
function w2openForm(){
 let cat='虚拟物品';
 open(`<div class="wo-title">记下新心愿</div>
<div class="row-line"><div class="ic">${w2Gift}</div><div class="main"><small>心愿物品名称</small><input id="wn" placeholder="请输入名称" autocomplete="off"></div></div>
<div class="budget"><small>目标预算</small><div class="price"><span>¥</span><input id="wb" type="number" inputmode="decimal" placeholder="请输入金额"></div></div>
<span class="cat-label">所属品类</span>
<div class="cats"><button class="on" data-c="虚拟物品">虚拟物品</button><button data-c="实物资产">实物资产</button></div>
<div class="msg-row"><small>愿望寄语 选填</small><textarea id="wm" placeholder="写点什么吧"></textarea></div>
<button class="btn" id="ok" disabled>确定加入心愿单</button>`,'w2sheet');
 const wn=w2$('wn'),wb=w2$('wb'),ok=w2$('ok');
 const chk=()=>{ok.disabled=!(wn.value.trim()&&parseFloat(wb.value)>0)};
 wn.oninput=chk;wb.oninput=chk;
 w2$('sheet').querySelectorAll('.cats button').forEach(b=>b.onclick=()=>{
  w2$('sheet').querySelectorAll('.cats button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');cat=b.dataset.c;
 });
 ok.onclick=()=>{
  const n=wn.value.trim(),v=parseFloat(wb.value);
  if(!n||!(v>0))return;
  D.wishes.unshift({id:uid(),name:n,amt:r2(v),cat,note:w2$('wm').value.trim(),status:'ing',saved:0,logs:[]});
  save();close();w2render();toast('心愿已添加 ♡');
 };
 wn.focus();
}

render();
</script></body></html>
