<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Pink</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="app">
<div id="main"></div>
<button class="fab" id="fab" style="display:none"></button>
<nav id="nav"></nav>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="dmask" id="dmask"><div class="drawer" id="drawer"></div></div>
<!-- 弹窗A：某月收入明细（从账户详情双击金额进入） -->
<div class="mask a-mask" id="aMask" aria-hidden="true">
 <div class="sheet a-sheet" role="dialog" aria-modal="true" aria-labelledby="aTitle">
  <div class="a-title" id="aTitle">月份明细</div>
  <div class="a-sum" id="aSum" role="button" tabindex="0" title="双击新增一笔">¥0.00</div>
  <div class="a-cnt" id="aCnt"></div>
  <div class="a-list" id="aList"></div>
  <div class="two a-actions">
   <button class="btn" id="aBack" type="button" style="background:var(--l);color:var(--t)">返回</button>
   <button class="btn" id="aOk" type="button">确认</button>
  </div>
 </div>
</div>
<!-- 同步到账户：心愿单存入时选择账户 -->
<div class="mask sync-mask" id="syncMask" aria-hidden="true">
 <div class="sheet sync-sheet" role="dialog" aria-modal="true" aria-labelledby="syncTitle">
  <i class="hd"></i>
  <div class="sync-title" id="syncTitle">同步到账户</div>
  <div class="sync-line">本次存入 <b id="syncAmt">¥0.00</b></div>
  <div class="sync-list" id="syncList"></div>
  <div class="sync-preview" id="syncPreview"></div>
  <div class="sync-actions">
   <button class="btn" id="syncCancel" type="button" style="background:var(--l);color:var(--t)">取消</button>
   <button class="btn" id="syncSkip" type="button" style="background:var(--p2);color:#e0709b">不计入账户</button>
   <button class="btn" id="syncOk" type="button">确认存入</button>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>
<div class="banner" id="banner">哇塞你好厉害，已将此物收入囊中!</div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="imp" accept="application/json" hidden>
</div>
<script src="app.js"></script>
</body></html>
